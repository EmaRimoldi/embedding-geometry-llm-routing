name: CPU experiment checks
on: [push, pull_request]
jobs:
  final-experiments:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: reproducibility/environment/cpu-requirements.lock
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r reproducibility/environment/cpu-requirements.lock
      - run: make verify
      - run: make test COMPUTE_PYTHON=python
      - run: make smoke COMPUTE_PYTHON=python
      - run: make tables COMPUTE_PYTHON=python
