name: CPU experiment checks
on: [push, pull_request]
jobs:
  final-experiments:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment/cpu-requirements.lock
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r environment/cpu-requirements.lock
      - run: python scripts/verify_release.py
      - run: python -B -m pytest -q tests
      - run: python -B scripts/check_paper_results.py
      - run: python -B scripts/smoke_baselines.py
      - run: python -B scripts/smoke_nvidia.py
      - run: python -B scripts/smoke_pca.py
      - run: python -B scripts/smoke_pca.py --rows 160 --source-rows 120 --features 128
      - run: python -B scripts/smoke_orchestration.py
      - run: python -B scripts/render_saved_tables.py
